<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weekly Reports | Site Tracker</title><style>
/* __PORTAL_STYLES__ */
.shell{margin:0 auto;max-width:1040px;padding:0 28px 40px}.topbar{gap:15px}.headline{margin:40px 0 28px}.headline h1{font-size:30px}.tools{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:780px;margin-bottom:36px}.tool{border:1px solid var(--line);border-radius:16px;padding:30px;background:white;color:var(--ink);text-align:left}.tool:hover{border-color:var(--green)}.tool .icon{display:block;font-size:29px;color:var(--green);margin-bottom:23px}.tool h2{font-size:19px}.tool p{font-size:12px;margin:10px 0 20px}.subnav{margin-bottom:24px}.form-panel{background:white;border:1px solid var(--line);border-radius:14px;max-width:820px;margin:auto}form{padding:26px}.form-grid label{font-size:12px}label textarea{min-height:260px;line-height:1.8}label input,label select{min-width:0}input,textarea{direction:auto}.help{font-size:11px;color:var(--muted);line-height:1.7}.attachments{display:grid;gap:10px;margin:16px 0}.attachment{padding:12px 14px;background:#f4f6f0;border-radius:9px;display:flex;align-items:center;gap:12px}.attachment span{flex:1;overflow-wrap:anywhere;font-size:12px}.attachment small{color:var(--muted);font-size:10px}.attachment button{color:#9b503a}.filter{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:22px}.filter select{padding:11px;border:1px solid var(--line);border-radius:7px;max-width:100%}.report-list{display:grid;gap:14px}.report-card{background:white;border:1px solid var(--line);padding:22px;border-radius:12px}.report-card h2{font-size:17px;margin:10px 0}.report-card p{font-size:12px;margin:10px 0 18px;white-space:pre-wrap;overflow-wrap:anywhere}.report-meta{font-size:11px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap}.report-body{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.9;font-size:14px}.report-view{max-width:820px;margin:auto;background:white;border:1px solid var(--line);border-radius:14px;padding:30px}.report-view h2{line-height:1.5;overflow-wrap:anywhere}.report-view header{border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:25px}.media-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:24px}.media-item{margin:0;min-width:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}.media-item img,.media-item video{display:block;width:100%;max-height:420px;object-fit:contain;background:#edf0e9}.media-item figcaption{padding:12px;font-size:11px;overflow-wrap:anywhere;line-height:1.7}.media-item a{color:var(--green);text-decoration:underline}.legacy-link{font-size:12px;color:var(--muted);display:inline-block;padding:12px 0}.status{font-size:12px;color:var(--green);line-height:1.8;margin-top:12px}.form-foot{flex-wrap:wrap}.error{white-space:pre-wrap}.footer{border-top:1px solid var(--line);padding-top:22px;margin-top:45px}button:disabled{opacity:.5;cursor:wait}.submit-note{margin:16px 0 0}.history-count{font-size:11px;color:var(--muted)}
@media(max-width:700px){.shell{padding:0 20px 30px}.topbar{height:auto;min-height:74px;flex-wrap:wrap;padding:14px 0}.breadcrumb{flex-basis:100%}.headline{margin-top:28px}.headline h1{font-size:27px}.tools{grid-template-columns:1fr;gap:14px}.tool{padding:24px}.tool .icon{margin-bottom:15px}form{padding:20px}.form-grid{grid-template-columns:1fr}.wide{grid-column:1/-1}.report-view{padding:22px}.media-grid{grid-template-columns:1fr}.report-meta{gap:10px}.form-foot button{flex:1}label textarea{min-height:230px}}
@media print{.topbar,.headline,.subnav,.footer,.no-print{display:none!important}.shell,.report-view{max-width:none;padding:0;border:0}.report-body{font-size:12px}.media-item{break-inside:avoid}.media-item video{display:none}.media-grid{grid-template-columns:1fr 1fr}.media-item img{max-height:300px}}
</style></head><body><div class="shell"><header class="topbar"><div class="breadcrumb"><a href="/">← Dashboard</a> <span style="padding:0 10px">/</span> <b>Weekly reports</b></div><span class="date" id="identity"></span></header><div class="headline"><div><div class="eyebrow">PROJECT UPDATES</div><h1 id="pageTitle">Weekly reports</h1><p id="pageHint">Share progress at every stage of your project.</p></div></div><div class="subnav no-print"><button class="link hidden" id="backButton" type="button">← Back to weekly reports</button></div><div id="pageError" class="error hidden" role="alert"></div><main id="app"><div class="loading">Loading your workspace…</div></main><footer class="footer"><span>SITE TRACKER · Weekly project updates</span><a href="/5s">Site 5S & Appearance ↗</a></footer></div>
<dialog id="confirmDialog" aria-labelledby="confirmTitle" aria-describedby="confirmText"><div class="dialog-head"><h2 id="confirmTitle">Discard this draft?</h2></div><div style="padding:24px 27px"><p id="confirmText">Unsaved changes will be discarded.</p><div class="form-foot"><button class="btn primary" type="button" id="keepButton" autofocus>Keep editing</button><button class="btn" type="button" id="confirmButton">Discard draft</button></div></div></dialog><div class="toast hidden" id="toast" role="status"></div>
<script>
'use strict';
const $=s=>document.querySelector(s),esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),size=n=>(n/1024/1024).toFixed(1)+' MB';
let session=null,active='home',draft=null,dirty=false,busy=false,currentReport=null,pendingAction=null,historyProject='',historyOffset=null;
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Dubai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
function toast(message){$('#toast').textContent=message;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),4000)}
function pageError(message){$('#pageError').textContent=message;$('#pageError').classList.toggle('hidden',!message)}
async function api(path,options={}){const response=await fetch('/api/weekly/'+path,{...options,headers:{'Content-Type':'application/json',...options.headers}});const data=await response.json();if(!response.ok)throw new Error(data.error||'Unable to complete the request.');return data;}
function confirmAction(action,title='Discard this draft?',text='Your unsaved changes will be discarded.',label='Discard draft'){pendingAction=action;$('#confirmTitle').textContent=title;$('#confirmText').textContent=text;$('#confirmButton').textContent=label;$('#keepButton').textContent=label==='Delete report'?'Keep report':'Keep editing';$('#confirmDialog').showModal();}
$('#keepButton').onclick=()=>{pendingAction=null;$('#confirmDialog').close()};$('#confirmDialog').addEventListener('cancel',()=>pendingAction=null);$('#confirmButton').onclick=()=>{const action=pendingAction;pendingAction=null;$('#confirmDialog').close();if(action)action()};
function leave(action){if(busy){toast('Please wait for the current upload or save to finish.');return;}if(active==='form'&&dirty){confirmAction(()=>{dirty=false;action()});return;}action();}
function setPage(name,title,hint=''){active=name;$('#pageTitle').textContent=title;$('#pageHint').textContent=hint;$('#backButton').classList.toggle('hidden',name==='home');pageError('');}
function setLocation(reportId=null){const url=new URL(location.href);url.search='';if(reportId)url.searchParams.set('report',reportId);history.replaceState(history.state,'',url.pathname+url.search);}
$('#backButton').onclick=()=>leave(home);
function home(){setPage('home','Weekly reports','Share progress at every stage of your project.');draft=null;dirty=false;setLocation();$('#app').innerHTML='<nav class="tools" aria-label="Weekly reporting tools"><button class="tool" type="button" id="newReport"><span class="icon" aria-hidden="true">＋</span><h2>New weekly report</h2><p>Write an update and add photos or videos.</p><span class="link">Create a report →</span></button><button class="tool" type="button" id="reportHistory"><span class="icon" aria-hidden="true">▤</span><h2>Report history</h2><p>Read your team’s saved weekly updates.</p><span class="link">View reports →</span></button></nav><a class="legacy-link" href="/#reports">Previous visit & finishing checklist reports ↗</a>';$('#newReport').onclick=()=>startReport();$('#reportHistory').onclick=()=>showHistory();}
function startReport(report=null){if(!session.projects.length){pageError('No projects are available yet. Ask an administrator to add a project.');return;}draft=report?{...report,media:[...report.media]}:{id:crypto.randomUUID(),projectId:historyProject||(session.projects.length===1?session.projects[0].id:''),title:'',reportDate:today(),stage:'',body:'',media:[]};dirty=false;currentReport=report;setPage('form',report?'Edit weekly report':'New weekly report','For site mobilization, construction, finishing or any other project stage.');
 $('#app').innerHTML='<section class="form-panel"><form id="reportForm"><div class="form-grid"><label>Project<select id="reportProject" required '+(report?'disabled':'')+'><option value="">Choose a project</option>'+session.projects.map(p=>'<option value="'+esc(p.id)+'" '+(p.id===draft.projectId?'selected':'')+'>'+esc(p.name)+'</option>').join('')+'</select></label><label>Report date<input id="reportDate" type="date" required value="'+esc(draft.reportDate)+'"></label><label class="wide">Report subject<input id="reportSubject" dir="auto" maxlength="200" required placeholder="e.g. Site mobilization — weekly progress" value="'+esc(draft.title)+'"></label><label class="wide">Project stage <span class="help">(optional)</span><input id="reportStage" dir="auto" maxlength="120" list="projectStages" placeholder="e.g. Site mobilization, earthworks or structure" value="'+esc(draft.stage)+'"><datalist id="projectStages"><option value="Site mobilization"><option value="Earthworks"><option value="Structure"><option value="MEP"><option value="Finishing"><option value="Handover"><option value="Other"></datalist></label><label class="wide">Report details<textarea id="reportBody" dir="auto" required maxlength="40000" placeholder="Describe work completed, current site conditions, challenges and plans for next week. Write freely — no finishing checklist is required.">'+esc(draft.body)+'</textarea></label><div class="wide"><label>Photos & videos <span class="help">(optional)</span><input id="reportFiles" type="file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm,video/quicktime,.mov" multiple style="margin-top:12px;max-width:100%"></label><p class="help">Up to 10 files. Photos: 5 MB each. Videos: 25 MB each (MP4, WebM or MOV). Short MP4 clips work best across phones. Files are private to authorized users.</p><div id="attachmentList" class="attachments"></div><div id="uploadStatus" class="status" role="status" aria-live="polite"></div></div></div><div id="formError" class="error hidden" role="alert"></div><div class="form-foot"><button class="btn" type="button" id="cancelReport">Cancel</button><button class="btn primary" type="submit" id="saveReport">'+(report?'Save changes':'Submit weekly report')+'</button></div><p class="help submit-note">'+(session.user.role==='administrator'?'Administrators can edit or delete saved reports.':'You can submit new reports. Only administrators can edit or delete a saved report.')+'</p></form></section>';
 $('#reportForm').oninput=()=>dirty=true;$('#reportForm').onchange=()=>dirty=true;$('#reportForm').onsubmit=saveReport;$('#cancelReport').onclick=()=>leave(home);$('#reportFiles').onchange=uploadFiles;$('#reportProject').onchange=()=>{draft.projectId=$('#reportProject').value};renderAttachments();}
function setBusy(value){busy=value;if($('#reportForm'))$('#reportForm').querySelectorAll('input,select,textarea').forEach(control=>control.disabled=value);for(const selector of ['#saveReport','#cancelReport','#reportFiles','#backButton'])if($(selector))$(selector).disabled=value;if($('#reportProject'))$('#reportProject').disabled=value||!!currentReport||draft.media.length>0;document.querySelectorAll('[data-remove-file]').forEach(button=>button.disabled=value);}
function renderAttachments(){if(!$('#attachmentList'))return;$('#attachmentList').innerHTML=draft.media.map(m=>'<div class="attachment"><span>'+esc(m.name)+'<br><small>'+esc(m.type.startsWith('video/')?'Video':'Photo')+' · '+size(m.size)+'</small></span><button class="link" type="button" data-remove-file="'+esc(m.id)+'" aria-label="Remove '+esc(m.name)+'">Remove</button></div>').join('');document.querySelectorAll('[data-remove-file]').forEach(button=>button.onclick=()=>{draft.media=draft.media.filter(m=>m.id!==button.dataset.removeFile);dirty=true;renderAttachments()});$('#reportProject').disabled=busy||!!currentReport||draft.media.length>0;}
async function uploadFiles(){const input=$('#reportFiles'),files=[...input.files];if(!files.length)return;const projectId=$('#reportProject').value;if(!projectId){input.value='';$('#reportProject').reportValidity();toast('Choose a project before attaching files.');return;}if(draft.media.length+files.length>10){input.value='';toast('Use up to ten attachments per report.');return;}setBusy(true);$('#formError').classList.add('hidden');let uploaded=0;try{for(const file of files){const type=file.type||(file.name.toLowerCase().endsWith('.mov')?'video/quicktime':'');if(!['image/jpeg','image/png','image/webp','image/gif','video/mp4','video/webm','video/quicktime'].includes(type))throw new Error('Unsupported file: '+file.name+'. Use a JPEG/PNG photo or MP4/WebM/MOV video.');const limit=(type.startsWith('image/')?5:25)*1024*1024;if(file.size>limit)throw new Error(file.name+' exceeds the '+(type.startsWith('image/')?'5':'25')+' MB limit. Choose a smaller file.');$('#uploadStatus').textContent='Uploading '+file.name+'…';const response=await fetch('/api/weekly/media?'+new URLSearchParams({projectId,name:file.name}),{method:'POST',headers:{'Content-Type':type},body:file});const data=await response.json();if(!response.ok)throw new Error(data.error||'Upload failed.');draft.media.push(data);uploaded++;dirty=true;renderAttachments();}$('#uploadStatus').textContent=uploaded+' file'+(uploaded===1?'':'s')+' ready. Submit the report to share them.';}catch(error){$('#formError').textContent=error.message;$('#formError').classList.remove('hidden');$('#uploadStatus').textContent=uploaded?uploaded+' files uploaded; choose any remaining files again.':'Upload stopped. Choose the file again to retry.';}finally{input.value='';setBusy(false);}}
async function saveReport(event){event.preventDefault();if(busy)return;const form=$('#reportForm');if(!form.reportValidity())return;setBusy(true);$('#formError').classList.add('hidden');const editing=!!currentReport;const data={id:draft.id,projectId:$('#reportProject').value,title:$('#reportSubject').value,reportDate:$('#reportDate').value,stage:$('#reportStage').value,body:$('#reportBody').value,attachments:draft.media.map(m=>m.id)};try{const report=await api(currentReport?'reports/'+draft.id:'reports',{method:currentReport?'PUT':'POST',body:JSON.stringify(data)});dirty=false;busy=false;viewReport(report);toast(editing?'Report saved.':'Weekly report submitted.');}catch(error){$('#formError').textContent=error.message;$('#formError').classList.remove('hidden');$('#formError').scrollIntoView({behavior:'smooth',block:'center'});}finally{setBusy(false);}}
async function showHistory(){setPage('history','Report history','Weekly updates from all authorized project teams.');draft=null;currentReport=null;dirty=false;setLocation();$('#app').innerHTML='<div class="filter"><select id="historyProject" aria-label="Filter reports by project"><option value="">All projects</option>'+session.projects.map(p=>'<option value="'+esc(p.id)+'" '+(p.id===historyProject?'selected':'')+'>'+esc(p.name)+'</option>').join('')+'</select><button class="btn primary" type="button" id="historyNew">＋ New report</button></div><div class="report-list" id="reportList"></div><button class="btn hidden" id="loadMore" style="margin-top:20px">Load more reports</button>';$('#historyNew').onclick=()=>startReport();$('#historyProject').onchange=()=>{historyProject=$('#historyProject').value;loadHistory()};$('#loadMore').onclick=()=>loadHistory(historyOffset);await loadHistory();}
let historyRequest=0;
async function loadHistory(offset=0){const requestNumber=++historyRequest,container=$('#reportList');if(!offset)container.innerHTML='<div class="loading">Loading reports…</div>';$('#loadMore').disabled=true;try{const params=new URLSearchParams({offset:String(offset||0)});if(historyProject)params.set('projectId',historyProject);const data=await api('reports?'+params);if(active!=='history'||requestNumber!==historyRequest)return;if(!offset)container.innerHTML='';if(!data.items.length&&!offset)container.innerHTML='<div class="empty"><h3>No weekly reports yet</h3><p>Create the first update for this project.</p></div>';for(const r of data.items){const card=document.createElement('article');card.className='report-card';card.innerHTML='<div class="report-meta"><span>'+esc(r.projectName)+'</span><span>'+esc(r.reportDate)+'</span></div><h2>'+esc(r.title)+'</h2><p dir="auto">'+esc(r.preview)+(r.preview.length===180?'…':'')+'</p><div class="section-row" style="margin:0"><span class="history-count">'+esc(r.authorName)+' · '+r.attachmentCount+' attachments</span><button class="link" data-view-report="'+esc(r.id)+'">Open report →</button></div>';card.querySelector('button').onclick=()=>openReport(r.id);container.append(card);}historyOffset=data.nextOffset;$('#loadMore').classList.toggle('hidden',historyOffset===null);}catch(error){if(active==='history'&&requestNumber===historyRequest){pageError(error.message);if(!offset)container.innerHTML='';}}finally{if(active==='history'&&requestNumber===historyRequest)$('#loadMore').disabled=false;}}
async function openReport(id){pageError('');try{viewReport(await api('reports/'+id));}catch(error){pageError(error.message)}}
function viewReport(report){currentReport=report;setPage('report','Weekly report');setLocation(report.id);const admin=session.user.role==='administrator';$('#app').innerHTML='<article class="report-view"><header><div class="report-meta"><span>'+esc(report.projectName)+'</span><span>'+esc(report.reportDate)+'</span>'+(report.stage?'<span>'+esc(report.stage)+'</span>':'')+'</div><h2 dir="auto" style="margin:18px 0 12px">'+esc(report.title)+'</h2><div class="report-meta">Submitted by '+esc(report.authorName)+'</div></header><div class="report-body" dir="auto">'+esc(report.body)+'</div>'+(report.media.length?'<h3 style="margin-top:30px">Photos & videos</h3><div class="media-grid">'+report.media.map(m=>'<figure class="media-item">'+(m.type.startsWith('video/')?'<video controls preload="metadata" playsinline src="'+esc(m.url)+'">Your browser cannot play this video. Use the file link below.</video>':'<a href="'+esc(m.url)+'" target="_blank" rel="noopener"><img loading="lazy" src="'+esc(m.url)+'" alt="'+esc(m.name)+'"></a>')+'<figcaption>'+esc(m.name)+' · '+size(m.size)+'<br><a href="'+esc(m.url)+'" target="_blank" rel="noopener">Open / download file ↗</a></figcaption></figure>').join('')+'</div>':'')+'<div class="actions no-print" style="margin-top:30px"><button class="btn" id="backHistory">Report history</button><button class="btn" id="printReport">Print / Save PDF</button>'+(admin?'<button class="btn" id="editReport">Edit report</button><button class="btn" id="deleteReport">Delete report</button>':'')+'</div></article>';$('#backHistory').onclick=showHistory;$('#printReport').onclick=()=>window.print();if(admin){$('#editReport').onclick=()=>startReport(report);$('#deleteReport').onclick=()=>confirmAction(async()=>{try{await api('reports/'+report.id,{method:'DELETE'});toast('Report deleted.');await showHistory();}catch(error){pageError(error.message)}},'Delete this report?','The saved weekly report will be removed.','Delete report');}}
window.addEventListener('beforeunload',event=>{if(active==='form'&&dirty){event.preventDefault();event.returnValue=''}});
async function init(){try{const response=await fetch('/api/5s/session'),data=await response.json();if(!response.ok)throw new Error(data.error||'Unable to verify your access.');session=data;$('#identity').textContent=session.user.name;const params=new URLSearchParams(location.search);if(params.get('report'))await openReport(params.get('report'));else if(params.has('new'))startReport();else home();}catch(error){pageError(error.message);$('#app').innerHTML='<div class="empty"><h3>Unable to open weekly reports</h3><p>Please reload to retry or sign in with your approved account.</p><a class="btn" href="/signin-with-chatgpt?return_to=/weekly">Sign in</a></div>';}}
init();
</script></body></html>
